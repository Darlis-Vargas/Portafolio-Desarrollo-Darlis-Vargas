<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/api-store.css">
</head>
<body class="bg-light">
<!-- Navbar  -->
<nav class="navbar navbar-dark bg-dark mb-4 py-3 shadow">
    <div class="container d-flex justify-content-center">
        <span class="navbar-brand fw-bold fs-3 text-uppercase m-0" style="letter-spacing: 2px;">
            🛍️ Tienda Online
        </span>
    </div>
</nav>

    <div class="container">
        <!-- Carrusel -->
        <div id="carrusel" class="carousel slide mb-5 shadow-sm rounded overflow-hidden" data-bs-ride="carousel">
            <!-- Dinámico -->
        </div>

        <!-- Ofertas Especiales -->
        <h3 class="mb-3 fw-bold">Ofertas Especiales</h3>
        <div id="ofertas" class="row mb-5">
            <!-- Dinámico -->
        </div>

        <!-- Todos los Productos -->
        <h3 class="mb-3 fw-bold">Todos los Productos</h3>
        <div id="catalogo" class="row">
            <!-- Dinámico -->
        </div>
    </div>

    <!-- Modal de Detalles -->
    <div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <!-- Dinámico -->
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle y Script Principal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-store.js"></script>
</body>
</html>
